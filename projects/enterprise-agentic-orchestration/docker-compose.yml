    environment:
      POSTGRES_USER: ${POSTGRES_USER:-fraud_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: banking_core_db
    volumes:
    - pg-banking:/var/lib/postgresql/data
    healthcheck:
      test:
