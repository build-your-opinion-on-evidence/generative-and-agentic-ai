x-common-env:
  KAFKA_BOOTSTRAP_SERVERS: kafka:9092
  OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4317
  OTEL_SERVICE_VERSION: ${OTEL_SERVICE_VERSION:-1.0.0}
  ENVIRONMENT: ${ENVIRONMENT:-local}
  LOG_LEVEL: ${LOG_LEVEL:-INFO}
  POSTGRES_USER: ${POSTGRES_USER:-fraud_user}
  POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
x-openai-env:
  OPENAI_API_KEY: ${OPENAI_API_KEY}
  OPENAI_MODEL: ${OPENAI_MODEL:-gpt-4o}
  OPENAI_TIMEOUT_SECONDS: ${OPENAI_TIMEOUT_SECONDS:-60}
  OPENAI_MAX_RETRIES: ${OPENAI_MAX_RETRIES:-2}
  OPENAI_TEMPERATURE: ${OPENAI_TEMPERATURE:-0}
x-service-defaults:
  restart: unless-stopped
  networks: &id001
  - fraud-net
  depends_on: &id002
    kafka:
      condition: service_healthy
services:
  zookeeper:
    image: confluentinc/cp-zookeeper:7.6.1
    hostname: zookeeper
    container_name: fraud-zookeeper
    networks:
    - fraud-net
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    healthcheck:
      test:
      - CMD
      - bash
      - -c
      - echo ruok | nc localhost 2181
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped
  kafka:
    image: confluentinc/cp-kafka:7.6.1
    hostname: kafka
    container_name: fraud-kafka
    networks:
    - fraud-net
    depends_on:
      zookeeper:
        condition: service_healthy
    ports:
    - ${KAFKA_EXTERNAL_PORT:-29092}:29092
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,PLAINTEXT_HOST://localhost:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: 'false'
      KAFKA_LOG_RETENTION_HOURS: 24
    healthcheck:
      test:
      - CMD
      - kafka-broker-api-versions
      - --bootstrap-server
      - localhost:9092
      interval: 15s
      timeout: 10s
      retries: 15
    restart: unless-stopped
  kafka-init:
    image: confluentinc/cp-kafka:7.6.1
    container_name: fraud-kafka-init
    networks:
    - fraud-net
    depends_on:
      kafka:
        condition: service_healthy
    command: "bash -c \"\n  echo 'Creating Kafka topics...' &&\n  kafka-topics --bootstrap-server\
      \ kafka:9092 --create --if-not-exists --topic banking.business-events.v1 --partitions\
      \ 4 --replication-factor 1 &&\n  kafka-topics --bootstrap-server kafka:9092\
      \ --create --if-not-exists --topic fraud.task-events.v1 --partitions 4 --replication-factor\
      \ 1 &&\n  kafka-topics --bootstrap-server kafka:9092 --create --if-not-exists\
      \ --topic fraud.orchestration-events.v1 --partitions 4 --replication-factor\
      \ 1 &&\n  kafka-topics --bootstrap-server kafka:9092 --create --if-not-exists\
      \ --topic fraud.agent-events.v1 --partitions 4 --replication-factor 1 &&\n \
      \ kafka-topics --bootstrap-server kafka:9092 --create --if-not-exists --topic\
      \ fraud.approval-events.v1 --partitions 2 --replication-factor 1 &&\n  kafka-topics\
      \ --bootstrap-server kafka:9092 --create --if-not-exists --topic fraud.action-events.v1\
      \ --partitions 4 --replication-factor 1 &&\n  kafka-topics --bootstrap-server\
      \ kafka:9092 --create --if-not-exists --topic fraud.dead-letter.v1 --partitions\
      \ 2 --replication-factor 1 &&\n  echo 'All topics created successfully.'\n\"\
      \n"
    restart: on-failure
  kafka-ui:
    image: provectuslabs/kafka-ui:v0.7.2
    container_name: fraud-kafka-ui
    networks:
    - fraud-net
    ports:
    - 8090:8080
    depends_on:
      kafka:
        condition: service_healthy
    environment:
      KAFKA_CLUSTERS_0_NAME: fraud-cluster
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:9092
    restart: unless-stopped
  postgres-task-manager:
    image: postgres:16.3
    container_name: fraud-postgres-task-manager
    networks:
    - fraud-net
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-fraud_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: task_manager_db
    volumes:
    - pg-task-manager:/var/lib/postgresql/data
    healthcheck:
      test:
      - CMD-SHELL
      - pg_isready -U ${POSTGRES_USER:-fraud_user} -d task_manager_db
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped
  postgres-orchestrator:
    image: postgres:16.3
    container_name: fraud-postgres-orchestrator
    networks:
    - fraud-net
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-fraud_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: orchestrator_db
    volumes:
    - pg-orchestrator:/var/lib/postgresql/data
    - ./database/migrations/airflow_init.sql:/docker-entrypoint-initdb.d/01_airflow_init.sql
    healthcheck:
      test:
      - CMD-SHELL
      - pg_isready -U ${POSTGRES_USER:-fraud_user} -d orchestrator_db
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped
  postgres-agent-registry:
