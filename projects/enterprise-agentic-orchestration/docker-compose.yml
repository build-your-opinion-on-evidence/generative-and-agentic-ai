    environment:
      POSTGRES_USER: ${POSTGRES_USER:-fraud_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: approval_db
    volumes:
    - pg-approval:/var/lib/postgresql/data
    healthcheck:
      test:
      - CMD-SHELL
      - pg_isready -U ${POSTGRES_USER:-fraud_user} -d approval_db
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped
  postgres-banking:
    image: postgres:16.3
    container_name: fraud-postgres-banking
    networks:
