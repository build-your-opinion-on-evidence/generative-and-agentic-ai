  airflow-init:
    image: apache/airflow:2.9.3
    container_name: fraud-airflow-init
    networks:
    - fraud-net
    depends_on:
      postgres-orchestrator:
        condition: service_healthy
    environment:
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      _PIP_ADDITIONAL_REQUIREMENTS: 'confluent-kafka httpx'
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://${POSTGRES_USER:-fraud_user}:${POSTGRES_PASSWORD}@postgres-orchestrator:5432/airflow_db
      AIRFLOW__CORE__FERNET_KEY: ${AIRFLOW__CORE__FERNET_KEY}
      AIRFLOW__WEBSERVER__SECRET_KEY: ${AIRFLOW__WEBSERVER__SECRET_KEY}
      AIRFLOW__WEBSERVER__WEB_SERVER_MASTER_TIMEOUT: '600'
      AIRFLOW__WEBSERVER__WEB_SERVER_WORKER_TIMEOUT: '600'
      _AIRFLOW_DB_MIGRATE: 'true'
      _AIRFLOW_WWW_USER_CREATE: 'true'
      _AIRFLOW_WWW_USER_USERNAME: admin
      _AIRFLOW_WWW_USER_PASSWORD: admin123
    command: version
    restart: on-failure
  airflow-webserver:
    image: apache/airflow:2.9.3
