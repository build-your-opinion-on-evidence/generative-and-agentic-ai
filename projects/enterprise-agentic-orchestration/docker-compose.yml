      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: agent_registry_db
    volumes:
    - pg-agent-registry:/var/lib/postgresql/data
    healthcheck:
      test:
      - CMD-SHELL
      - pg_isready -U ${POSTGRES_USER:-fraud_user} -d agent_registry_db
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped
  postgres-policy:
    image: postgres:16.3
    container_name: fraud-postgres-policy
    networks:
    - fraud-net
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-fraud_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: policy_db
    volumes:
