receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318

processors:
  batch:
    timeout: 1s
    send_batch_size: 1024

  memory_limiter:
    check_interval: 1s
    limit_mib: 256

  resource:
    attributes:
      - key: environment
        value: local
        action: insert

exporters:
  prometheus:
    endpoint: "0.0.0.0:8889"
    namespace: fraud_platform

  debug:
    verbosity: normal

  # NOTE: The 'logging' exporter was removed in OTel Collector 0.86+.
  # Use the 'debug' exporter instead.
  debug/logs:
    verbosity: basic

service:
  pipelines:
    traces:
      receivers: [otlp]
      processors: [memory_limiter, batch]
      exporters: [debug]

    metrics:
      receivers: [otlp]
      processors: [memory_limiter, batch]
      exporters: [prometheus]

    logs:
      receivers: [otlp]
      processors: [memory_limiter, batch]
      exporters: [debug/logs]
